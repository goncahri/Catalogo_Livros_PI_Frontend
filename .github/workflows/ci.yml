name: CI Frontend

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install || true

      - name: Validar arquivos HTML
        run: echo "Frontend estático validado"

      - name: Build informativo
        run: echo "Projeto HTML/CSS/JS sem etapa de build"

      - name: Login no Docker Hub
        if: github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build da imagem Docker HML
        if: github.ref == 'refs/heads/develop'
        run: |
          docker build -t goncahri/catalogo-livros-frontend:hml .
          docker tag goncahri/catalogo-livros-frontend:hml goncahri/catalogo-livros-frontend:develop

      - name: Push da imagem Docker HML
        if: github.ref == 'refs/heads/develop'
        run: |
          docker push goncahri/catalogo-livros-frontend:hml
          docker push goncahri/catalogo-livros-frontend:develop

      - name: Trigger Deploy Render HML
        if: github.ref == 'refs/heads/develop'
        run: |
          if [ -n "${{ secrets.RENDER_HML_DEPLOY_HOOK }}" ]; then
            curl -X POST "${{ secrets.RENDER_HML_DEPLOY_HOOK }}"
          else
            echo "RENDER_HML_DEPLOY_HOOK ainda não configurado"
          fi

      - name: Rodar semantic-release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: npx semantic-release