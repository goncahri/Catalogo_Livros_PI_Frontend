<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Usuário - Catálogo de Livros</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
    rel="stylesheet"
  />

  <style>
    body{
      background-color:#f8f9fa;
    }

    .form-container{
      max-width:420px;
      margin:60px auto;
      background:white;
      padding:30px;
      border-radius:10px;
      box-shadow:0 0 12px rgba(0,0,0,.1);
    }

    .logo{
      max-width:120px;
      display:block;
      margin:0 auto 20px;
    }

    .btn-green{
      background:#4caf50;
      color:white;
    }

    .btn-green:hover{
      background:#43a047;
    }

    .link-login{
      margin-top:15px;
      text-align:center;
    }

    .link-login a{
      text-decoration:none;
      color:#4caf50;
    }

    .input-group-text{
      cursor:pointer;
    }

    .password-tip{
      font-size:.85rem;
      color:#666;
    }
  </style>
</head>

<body>

<div class="form-container">

  <img src="images/logo.png" class="logo">

  <h3 class="text-center mb-4">
    Cadastro de Usuário
  </h3>

  <form id="formUsuario">

    <div class="mb-3">
      <label class="form-label">
        Nome e Sobrenome
      </label>

      <input
        type="text"
        class="form-control"
        id="nome"
        required
      />
    </div>


    <div class="mb-3">
      <label class="form-label">
        E-mail
      </label>

      <input
        type="email"
        class="form-control"
        id="login"
        required
      />
    </div>


    <div class="mb-3">

      <label class="form-label">
        WhatsApp
      </label>

      <input
        type="text"
        class="form-control"
        id="telefone"
        placeholder="5511999999999"
        maxlength="13"
        required
      />

      <small class="password-tip">
        Exemplo: 5511999999999
      </small>

    </div>


    <div class="mb-3">

      <label class="form-label">
        Senha
      </label>

      <div class="input-group">

        <input
          type="password"
          class="form-control"
          id="senha"
          required
        />

        <span
          class="input-group-text"
          onclick="toggleSenha('senha', this)"
        >
          <i class="bi bi-eye"></i>
        </span>

      </div>

      <small class="password-tip">
        6+ caracteres, maiúscula,
        minúscula, número e especial
      </small>

    </div>


    <div class="mb-3">

      <label class="form-label">
        Confirmar senha
      </label>

      <div class="input-group">

        <input
          type="password"
          class="form-control"
          id="confirmaSenha"
          required
        />

        <span
          class="input-group-text"
          onclick="toggleSenha('confirmaSenha', this)"
        >
          <i class="bi bi-eye"></i>
        </span>

      </div>

    </div>


    <div class="d-grid">
      <button
        type="submit"
        class="btn btn-green"
      >
        Cadastrar
      </button>
    </div>

  </form>


  <div class="link-login">

    Já possui cadastro?
    <a href="login.html">
      Efetue o login
    </a>

    <br><br>

    <a href="#">
      Esqueci minha senha
    </a>

  </div>

</div>


<div
  class="modal fade"
  id="modalMensagem"
  tabindex="-1"
>

  <div class="modal-dialog modal-dialog-centered">

    <div class="modal-content">

      <div
        class="modal-body"
        id="mensagemModal"
      >
      </div>

    </div>

  </div>

</div>


<script>

const currentHost =
  window.location.hostname;

const isLocal =
  currentHost==="localhost" ||
  currentHost==="127.0.0.1";

const isHml =
  currentHost.includes("hml") ||
  currentHost.includes("develop");

const baseURL = isLocal
  ? "http://localhost:3000/api"
  : isHml
    ? "https://catalogo-livros-pi-backend-hml-docker.onrender.com/api"
    : "https://catalogo-livros-pi-backend-prod-docker.onrender.com/api";


document
.getElementById("telefone")
.addEventListener("input",(e)=>{

  e.target.value =
    e.target.value
      .replace(/\D/g,"")
      .slice(0,13);

});


document
.getElementById("formUsuario")
.addEventListener("submit",async(event)=>{

  event.preventDefault();

  const nome =
    document.getElementById("nome").value.trim();

  const email =
    document.getElementById("login").value.trim();

  const telefone =
    document.getElementById("telefone").value.trim();

  const senha =
    document.getElementById("senha").value;

  const confirmaSenha =
    document.getElementById("confirmaSenha").value;


  const modal =
    new bootstrap.Modal(
      document.getElementById("modalMensagem")
    );

  const mensagemModal =
    document.getElementById("mensagemModal");

  mensagemModal.innerHTML = "";


  if(senha!==confirmaSenha){

    mensagemModal.innerHTML=
      "<span class='text-danger'>As senhas não coincidem.</span>";

    modal.show();

    return;
  }


  const senhaForte =
    /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*#?&]).{6,}$/;


  if(!senhaForte.test(senha)){

    mensagemModal.innerHTML=
      "<span class='text-danger'>Senha inválida.</span>";

    modal.show();

    return;
  }


  const dadosUsuario = {

    nome,
    email,
    telefone,
    senha

  };


  try{

    const res =
      await fetch(
        `${baseURL}/usuarios`,
        {

          method:"POST",

          headers:{
            "Content-Type":"application/json"
          },

          body:
            JSON.stringify(
              dadosUsuario
            )

        }
      );

    const data =
      await res.json();


    if(data.acknowledged){

      mensagemModal.innerHTML =
        "<span class='text-success'>Usuário cadastrado com sucesso!</span>";

      modal.show();

      setTimeout(()=>{

        window.location.href =
          "login.html";

      },2000);

    }

    else{

      mensagemModal.innerHTML =
        "<span class='text-danger'>Erro ao cadastrar.</span>";

      modal.show();

    }

  }

  catch(error){

    mensagemModal.innerHTML =
      "<span class='text-danger'>Erro de conexão.</span>";

    modal.show();

    console.error(error);

  }

});


function toggleSenha(
  idCampo,
  elemento
){

  const campo =
    document.getElementById(
      idCampo
    );

  const tipo =
    campo.type==="password"
      ? "text"
      : "password";

  campo.type = tipo;

  const icone =
    elemento.querySelector("i");

  icone.className =
    tipo==="password"
      ? "bi bi-eye"
      : "bi bi-eye-slash";

}

</script>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
